<!doctype html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1, maximum-scale=1">
        <title>ARtEye</title>
        <script src="encantar.js" defer></script>
        <script src="js/markers.js" defer></script>
        <script src="js/ui-controller.js" defer></script>
        <script src="js/app.js" defer></script>
        <link rel="stylesheet" href="css/styles.css">
    </head>

    <body>
        <div id="ar-viewport"></div>
        <img id="painting1" src="assets/images/painting1.jpeg" hidden>
        <img id="painting2" src="assets/images/painting2.jpeg" hidden>
        <img id="painting3" src="assets/images/painting3.jpeg" hidden>
        <img id="painting4" src="assets/images/painting4.jpeg" hidden>
        <img id="painting5" src="assets/images/painting5.jpeg" hidden>
    
        <!-- Welcome Screen -->
        <div id="welcomeScreen">
            <div class="welcome-content">
                <h1 class="welcome-title">ARt Eye</h1>
                <p class="welcome-subtitle">AR Gallery</p>
                <p class="welcome-description">Your AR Gallery Experience.</p>
                <button class="cta-btn" onclick="startExperience()">Start Exploring</button>
            </div>
        </div>

        <!-- Scan Overlay -->
        <div id="scanOverlay">
            <!-- <div id="scanFrame">
                <span class="corner tl"></span>
                <span class="corner tr"></span>
                <span class="corner bl"></span>
                <span class="corner br"></span>
            </div> -->
            <p id="scanHint">Fill the frame with the artwork</p>
        </div>

        <!-- Info Card (hidden by default) -->
        <div id="infoCard" class="info-card hidden">
            <button id="closeCard" class="close-btn" onclick="closeInfoCard()">×</button>

            <div class="card-content">
                <img id="paintingImage" alt="Painting">

                <h2 id="title"></h2>
                <p class="artist" id="artist"></p>
                <p class="description" id="description"></p>

                <button id="formButton" class="cta-btn" onclick="goToForm()">Contact Us</button>
            </div>
        </div>

    </body>
</html>
