<!doctype html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1, maximum-scale=1">
        <title>ARt eye</title>
        <script src="encantar.js" defer></script>
        <script src="js/markers.js" defer></script>
        <script src="js/ui-controller.js" defer></script>
        <script src="js/app.js" defer></script>
        <link rel="stylesheet" href="css/styles.css">
    </head>

    <body>
        <div id="ar-viewport"></div>
        <img id="painting1" src="assets/images/1.jpeg" hidden>
        <img id="painting2" src="assets/images/2.jpeg" hidden>
        <img id="painting3" src="assets/images/3.jpeg" hidden>
        <img id="painting4" src="assets/images/4.jpeg" hidden>
        <img id="painting5" src="assets/images/5.jpeg" hidden>
        <img id="painting6" src="assets/images/6.jpeg" hidden>
        <img id="painting7" src="assets/images/7.jpeg" hidden>
        <img id="painting8" src="assets/images/8.jpeg" hidden>
        <img id="painting9" src="assets/images/9.jpeg" hidden>
        <img id="painting10" src="assets/images/10.jpeg" hidden>
        <img id="painting11" src="assets/images/11.jpeg" hidden>
        <img id="painting12" src="assets/images/12.jpeg" hidden>
        <img id="painting13" src="assets/images/13.jpeg" hidden>
    
        <!-- Welcome Screen -->
        <div id="welcomeScreen">
            <div class="welcome-content">
                <h1 class="welcome-title">ARt eye</h1>
                <p class="welcome-subtitle">Augmented Reality Gallery</p>
                <p class="welcome-description">Your AR Gallery Experience.</p>
                <button class="cta-btn" onclick="startExperience()">Start Exploring</button>
            </div>
        </div>

        <!-- Scan Overlay -->
        <div id="scanOverlay">
            <div id="zoomControl">
                <button onclick="adjustZoom(1)">+</button>
                <span id="zoomLevel">1×</span>
                <button onclick="adjustZoom(-1)">−</button>
            </div>
            <p id="scanHint">Fill the frame with the artwork</p>
        </div>

        <!-- Info Card (hidden by default) -->
        <div id="infoCard" class="info-card hidden">
            <button id="closeCard" class="close-btn" onclick="closeInfoCard()">×</button>

            <div class="card-content">
                <img id="paintingImage" alt="Painting">

                <h2 id="title"></h2>
                <p class="artist" id="artist"></p>
                <p class="description" id="description"></p>

                <button id="formButton" class="cta-btn" onclick="goToForm()">Contact Us</button>
            </div>
        </div>

    </body>
</html>
