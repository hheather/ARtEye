<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AR Gallery</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="js/cam.js"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Camera selector UI -->
    <div style="position: absolute; top: 10px; left: 10px; z-index: 1000; background: white; padding: 10px;">
        <label>Select Camera:</label>
        <select id="cameraSelect"></select>
        <button onclick="switchCamera()">Switch</button>
    </div>

    <a-scene
        embedded
        arjs="sourceType: webcam; debugUIEnabled: false;"
        vr-mode-ui="enabled: false">
        
        <!-- Hiro = Painting 1 -->
        <a-marker preset="hiro" id="painting1" registerevents></a-marker>

        <a-entity camera></a-entity>
    </a-scene>
    
    <!-- Info Card -->
    <div id="infoCard" class="info-card hidden">
        <button class="close-btn" onclick="closeInfoCard()">×</button>
        <div class="card-content">
            <img id="paintingImage" src="" alt="Painting">
            <h2 id="paintingTitle"></h2>
            <p id="paintingArtist"></p>
            <p id="paintingDescription"></p>
            <button class="cta-btn" onclick="goToForm()">Contact Sales</button>
        </div>
    </div>
    
    <div id="loadingScreen" class="loading-screen">
        <p>Point your camera at a marker</p>
    </div>
    
    <script src="js/markers.js"></script>
    <script src="js/ui-controller.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
